<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shelter OS — an operations platform for animal shelters: intake, medical care, adoption, fostering, rescue, and donations in one system." />
    <title>Shelter OS</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('shelter-os-theme');
          var theme = stored ? JSON.parse(stored) : 'system';
          var resolved =
            theme === 'system'
              ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : theme;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
